[package]
name = "golem-runner"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99.1"

[dependencies]
base64 = "0.22"
dryoc = { version = "=2.0.0", default-features = false, features = ["std"] }
flate2 = "1"
hmac = "0.13"
ignore = { version = "0.4", default-features = false }
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
router = { version = "0.1.0", path = "../router" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
insta = { version = "1.49", default-features = false }

[lints]
workspace = true
