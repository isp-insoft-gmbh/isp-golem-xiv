name: ci

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on trunk always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name is the required status check of trunk; keep it `ci`.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: mise run ci
