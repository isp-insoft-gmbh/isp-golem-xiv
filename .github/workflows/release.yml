name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Trusted, immutable release tags only; this job creates the GitHub release.
    permissions:
      contents: write
    env:
      GOLEM_CHECK_ADVISORIES: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+$ ]]
          test "$(git cat-file -t "$TAG")" = tag
          git merge-base --is-ancestor HEAD origin/trunk
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          version: "2026.10.21"
      - run: mise run ci
      - run: mise run dist
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")
          mise exec -- gh release create "$TAG" \
            --verify-tag --generate-notes --notes "$notes" \
            dist/golem-runner-x86_64-unknown-linux-gnu.tar.gz \
            dist/golem-worker.tar.gz dist/SHA256SUMS \
            dist/golem-runner-linux-x86_64 dist/golem-runner-linux-x86_64.sha256 \
            dist/LICENSE dist/CDLA-Permissive-2.0.txt
