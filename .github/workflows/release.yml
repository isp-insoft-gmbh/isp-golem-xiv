name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No cache: release artifacts must not depend on state another workflow wrote.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
      - name: Require an annotated tag on trunk
        run: |
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          git merge-base --is-ancestor HEAD origin/trunk
      - name: Validate
        run: mise run ci
      - name: Build release assets into dist/
        run: mise run dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish with the tag message on top of the generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_object="$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)"
          message="$(gh api "repos/$GH_REPO/git/tags/$tag_object" --jq .message)"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$message" dist/*
