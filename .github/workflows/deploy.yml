name: deploy

on:
  push:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: production-worker
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Lockfile advisories were checked by the pull request; scheduled ci reports new ones.
      GOLEM_CHECK_ADVISORIES: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          version: "2026.10.21"
      - run: mise run ci

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          version: "2026.10.21"
      - run: mise run worker
      - name: Deploy production Worker
        run: |
          current=$(git ls-remote origin refs/heads/trunk | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skip superseded trunk revision"
            exit 0
          fi
          mise run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
