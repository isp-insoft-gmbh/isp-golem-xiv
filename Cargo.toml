[workspace]
members = ["router", "runner", "x"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/isp-insoft-gmbh/isp-golem-xiv"
rust-version = "1.99.1"

[workspace.lints.rust]
unsafe_code = "forbid"
let_underscore_drop = "deny"
irrefutable_let_patterns = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[profile.release]
lto = true
strip = true
codegen-units = 1

# wasm-bindgen must see target_features before wasm-opt performs final optimization.
[profile.release.package.router]
strip = "debuginfo"
