name: agent-image

# Builds the agent image that runner.yml pins and caches it, so golem runs load it instead of
# building, and a stop reaches them quickly. The image key carries the UTC month, hence the
# monthly schedule.
on:
  push:
    branches: [trunk]
    paths: [.github/workflows/runner.yml, .github/workflows/agent-image.yml]
  schedule:
    - cron: "5 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-image
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the runner and Mise pins from runner.yml
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/runner.yml
          url="$(sed -n 's|^ *RUNNER_RELEASE_URL: \(https://github\.com/isp-insoft-gmbh/isp-golem-xiv/releases/download/v[0-9][0-9]*\)$|\1|p' "$workflow")"
          sha="$(sed -n 's/^ *RUNNER_SHA256: \([0-9a-f]\{64\}\)$/\1/p' "$workflow")"
          mise="$(sed -n 's/^ *version: \(20[0-9][0-9]\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' "$workflow")"
          for value in "$url" "$sha" "$mise"; do
            test -n "$value"
            test "$(printf '%s\n' "$value" | wc -l)" = 1
          done
          {
            echo "url=$url"
            echo "sha=$sha"
            echo "mise=$mise"
          } >>"$GITHUB_OUTPUT"
      - name: Download pinned public runner
        timeout-minutes: 10
        env:
          RUNNER_RELEASE_URL: ${{ steps.pin.outputs.url }}
          RUNNER_SHA256: ${{ steps.pin.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 4 --retry-delay 5 --retry-max-time 180 --connect-timeout 20 --max-time 60 \
            --output golem-runner-linux-x86_64 \
            "$RUNNER_RELEASE_URL/golem-runner-linux-x86_64"
          printf '%s  golem-runner-linux-x86_64\n' "$RUNNER_SHA256" | sha256sum --check --strict -
          chmod 700 golem-runner-linux-x86_64
      - name: Install pinned mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: ${{ steps.pin.outputs.mise }}
          install: false
          cache: false
      - name: Name the agent image cache
        id: image
        shell: bash
        run: '"$RUNNER_TEMP/golem-runner-linux-x86_64" --image-key "$(command -v mise)"'
      - name: Look for the cached agent image
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.image.outputs.key }}
          path: ${{ runner.temp }}/golem-agent-image.tar
          lookup-only: true
      - name: Build the agent image
        if: steps.image-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        shell: bash
        run: '"$RUNNER_TEMP/golem-runner-linux-x86_64" --prepare "$(command -v mise)" "$RUNNER_TEMP/golem-agent-image.tar"'
      - name: Cache the agent image
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.image.outputs.key }}
          path: ${{ runner.temp }}/golem-agent-image.tar
