name: ci

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: "2026.10.21"
      - run: mise exec -- actionlint
      - run: mise exec -- zizmor --offline --min-severity low .github/workflows
