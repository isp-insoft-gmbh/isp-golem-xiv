name: runner
run-name: ${{ inputs.repo }} ${{ inputs.golem }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Target repository (owner/name)
        required: true
        type: string
      golem:
        description: Golem name
        required: true
        type: string
      request:
        description: Validated version 1 dispatch JSON
        required: true
        type: string

permissions: {}

jobs:
  runner:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 325
    steps:
      - name: Reject workflow reruns before agent access
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT:-}" = 1
      - name: Download pinned public runner
        timeout-minutes: 10
        env:
          RUNNER_RELEASE_URL: https://github.com/isp-insoft-gmbh/isp-golem-xiv/releases/download/v26
          RUNNER_SHA256: 4c48bfb9f15a34a28e4cfcd254eb4ccabac769a176ca6f7372de86a1bd0e2987
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # Idempotent GETs only: 408/429/5xx/timeouts retry within a bounded window; checksum still gates.
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 4 --retry-delay 5 --retry-max-time 180 --connect-timeout 20 --max-time 60 \
            --output golem-runner-linux-x86_64 \
            "$RUNNER_RELEASE_URL/golem-runner-linux-x86_64"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 4 --retry-delay 5 --retry-max-time 180 --connect-timeout 20 --max-time 60 \
            --output golem-runner-linux-x86_64.sha256 \
            "$RUNNER_RELEASE_URL/golem-runner-linux-x86_64.sha256"
          printf '%s  golem-runner-linux-x86_64\n' "$RUNNER_SHA256" | sha256sum --check --strict -
          sha256sum --check --strict golem-runner-linux-x86_64.sha256
          chmod 700 golem-runner-linux-x86_64
      - name: Validate dispatch before selecting credentials
        id: validate
        env:
          GOLEM_REQUEST: ${{ inputs.request }}
          GOLEM_REPO: ${{ inputs.repo }}
          GOLEM_NAME: ${{ inputs.golem }}
        shell: bash
        run: '"$RUNNER_TEMP/golem-runner-linux-x86_64" --validate'
      - name: Install pinned mise
        id: mise
        continue-on-error: true
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.11.14
          install: false
          cache: false
      - name: Name the agent image cache
        id: image
        if: steps.mise.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: '"$RUNNER_TEMP/golem-runner-linux-x86_64" --image-key "$(command -v mise)"'
      - name: Restore the agent image an earlier run built
        id: image-cache
        if: steps.image.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.image.outputs.key }}
          path: ${{ runner.temp }}/golem-agent-image.tar
      - name: Prepare isolated pinned Claude subscription harness
        id: prepare
        if: steps.mise.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: '"$RUNNER_TEMP/golem-runner-linux-x86_64" --prepare "$(command -v mise)" "$RUNNER_TEMP/golem-agent-image.tar"'
      # Saved before any step holds a seat or runs an agent, so no agent can write an image a later run loads.
      - name: Keep a newly built agent image for later runs
        if: steps.prepare.outcome == 'success' && steps.image.outcome == 'success' && steps.image-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.image.outputs.key }}
          path: ${{ runner.temp }}/golem-agent-image.tar
      - name: Run exactly one golem
        env:
          GOLEM_REQUEST: ${{ inputs.request }}
          GOLEM_REPO: ${{ inputs.repo }}
          GOLEM_NAME: ${{ inputs.golem }}
          GOLEM_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          GOLEM_PREPARATION: ${{ steps.prepare.outcome }}
          GOLEM_SEAT_SECRET_NAME: ${{ steps.validate.outputs.seat_secret }}
          # Native validation emits one SEAT_<LOGIN>__ANTHROPIC key; only its value becomes env.
          GOLEM_SEAT: ${{ secrets[steps.validate.outputs.seat_secret] }} # zizmor: ignore[overprovisioned-secrets]
        shell: bash
        run: '"$RUNNER_TEMP/golem-runner-linux-x86_64"'
      - name: Ensure cancellation cannot leave an agent alive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          name="golem-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if docker container inspect "$name" >/dev/null 2>&1; then
            docker rm --force "$name" >/dev/null
          fi
